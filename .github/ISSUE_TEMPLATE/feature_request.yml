name: 功能建议
description: 描述一个真实用户场景及期望结果
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 谁在什么场景下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果
      description: 完成后用户应该能够做什么？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方式
      description: 现在如何绕过？为什么不够好？
  - type: textarea
    id: scope
    attributes:
      label: 范围与示例
      description: 可附脱敏参考图、交互说明或边界条件。
